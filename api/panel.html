<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Judy Control Panel</title>
<style>
  :root { --bg: #f6f7f9; --text: #1b1f24; --muted: #667085; --line: #cdd2da; --accent: #2563eb; --accent-text: #fff;
          --now: #15803d; --now-text: #fff; --moved: #b45309; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1216; --text: #e8eaed; --muted: #98a2b3; --line: #3a414c;
      --accent: #3b82f6; --now: #22c55e; --now-text: #052e14; --moved: #fbbf24; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { width: 100%; max-width: 680px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 600; text-align: center; }
  .sub { color: var(--muted); font-size: 14px; text-align: center; margin-bottom: 16px; }

  /* Left edge is midnight, right edge is the next midnight, in the server's local time. The buttons share
     one row just above the line, each as close to its real time as the others allow. */
  .timeline { position: relative; height: 112px; }
  .line { position: absolute; left: 0; right: 0; top: 60px; height: 4px; border-radius: 2px; background: var(--line); }
  .tick { position: absolute; top: 56px; width: 2px; height: 12px; background: var(--line); transform: translateX(-50%); }
  .tick.major { top: 52px; height: 20px; }
  .tick-label { position: absolute; top: 80px; transform: translateX(-50%); font-size: 13px; color: var(--muted); white-space: nowrap; }
  .mark { position: absolute; top: 0; transform: translateX(-50%); min-width: 64px; min-height: 40px; font: inherit; font-size: 16px;
    font-weight: 600; white-space: nowrap; padding: 8px 14px; border: 0; border-radius: 10px; background: var(--accent);
    color: var(--accent-text); cursor: pointer; }
  .mark.now { background: var(--now); color: var(--now-text); }
  .mark:disabled { opacity: .55; cursor: wait; }
  .dot { position: absolute; top: 54px; width: 16px; height: 16px; border-radius: 50%; transform: translateX(-50%);
    background: var(--moved); border: 3px solid var(--bg); box-shadow: 0 0 0 2px var(--moved); display: none; }
  #status { margin-top: 12px; color: var(--muted); font-size: 15px; text-align: center; min-height: 48px; }
</style>
</head>
<body>
<main>
  <h1>Judy control panel</h1>
  <div class="sub" id="zone"></div>
  <div class="timeline" id="timeline" aria-label="Timeline of the day in server local time">
    <div class="line"></div>
    <div class="dot" id="dot" title="Where the clock is now"></div>
  </div>
  <div id="status" role="status"></div>
</main>

<script>
  // Buttons on the timeline. Each moves the clock to the next time the server's local clock reads `time`.
  const MARKS = [
    { label: "4 pm", time: "16:00" },
    { label: "9 pm", time: "21:00" },
  ];
  const TICKS = [["12 am", 0], ["6 am", 6], ["12 pm", 12], ["6 pm", 18], ["12 am", 24]];
  const GAP = 8;  // minimum space between neighbouring buttons

  const timeline = document.getElementById("timeline");
  const status = document.getElementById("status");
  const dot = document.getElementById("dot");
  let busy = false;

  const pct = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return ((h * 60 + m) / 1440) * 100; };
  // The server sends its local wall-clock time as an ISO string, so read HH:MM straight from the text.
  const hhmm = (iso) => iso.slice(11, 16);
  const wall = (iso) => new Date(iso.slice(0, 19)).toLocaleString([], { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });

  function el(tag, className, leftPct) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (leftPct !== undefined) node.style.left = leftPct + "%";
    return node;
  }

  for (let h = 0; h <= 24; h++) timeline.append(el("div", h % 6 === 0 ? "tick major" : "tick", (h / 24) * 100));
  for (const [text, h] of TICKS) { const t = el("div", "tick-label", (h / 24) * 100); t.textContent = text; timeline.append(t); }

  const marks = MARKS.map((m) => {
    const button = el("button", "mark");
    button.textContent = m.label;
    button.addEventListener("click", () => changeClock("Moving the clock and asking Judy…", "/v1/clock", {
      method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify({ next_at: m.time }),
    }));
    timeline.append(button);
    return { button, target: pct(m.time) };
  });

  // "Now" is at the real server time and puts the clock back to real time.
  const nowButton = el("button", "mark now");
  nowButton.textContent = "Now";
  nowButton.addEventListener("click", () => changeClock("Putting the clock back to real time…", "/v1/clock/reset", { method: "POST" }));
  timeline.append(nowButton);
  const nowMark = { button: nowButton, target: 0 };
  marks.push(nowMark);

  // Put the buttons on one row, as near their real spot as they can get without touching.
  function layout() {
    const width = timeline.clientWidth;
    const items = marks.map((m) => ({ m, w: m.button.offsetWidth, x: (m.target / 100) * width }))
      .sort((a, b) => a.x - b.x);
    for (let pass = 0; pass < 2; pass++) {
      items.forEach((it, i) => {   // left to right: stay inside the left edge and clear of the previous button
        it.x = Math.max(it.x, it.w / 2);
        if (i > 0) it.x = Math.max(it.x, items[i - 1].x + (items[i - 1].w + it.w) / 2 + GAP);
      });
      for (let i = items.length - 1; i >= 0; i--) {   // right to left: stay inside the right edge
        items[i].x = Math.min(items[i].x, width - items[i].w / 2);
        if (i < items.length - 1) items[i].x = Math.min(items[i].x, items[i + 1].x - (items[i + 1].w + items[i].w) / 2 - GAP);
      }
    }
    for (const it of items) it.m.button.style.left = it.x + "px";
  }

  function render(clock) {
    nowMark.target = pct(hhmm(clock.real_now_local));
    nowButton.title = "Real time: " + hhmm(clock.real_now_local);
    document.getElementById("zone").textContent = "Server time (" + clock.timezone + ")";
    dot.style.display = clock.simulated ? "block" : "none";
    dot.style.left = pct(hhmm(clock.now_local)) + "%";
    layout();
    if (!busy) {
      status.textContent = clock.simulated
        ? "Clock is moved to " + wall(clock.now_local) + "."
        : "Clock is on real time: " + wall(clock.now_local) + ".";
    }
  }

  const buttons = () => document.querySelectorAll("button");

  async function changeClock(label, path, options) {
    busy = true;
    buttons().forEach((b) => (b.disabled = true));
    status.textContent = label;
    try {
      const res = await fetch(path, options);
      if (!res.ok) throw new Error(res.status + " " + (await res.text()));
      const clock = await res.json();
      busy = false;
      render(clock);
      status.textContent += " Judy sent " + clock.messages_created + " message(s).";
    } catch (e) {
      status.textContent = String(e);
    } finally {
      busy = false;
      buttons().forEach((b) => (b.disabled = false));
    }
  }

  async function refresh() {
    if (busy) return;
    try { const res = await fetch("/v1/clock"); if (res.ok) render(await res.json()); } catch (e) { /* try again next time */ }
  }

  layout();
  window.addEventListener("resize", layout);
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
